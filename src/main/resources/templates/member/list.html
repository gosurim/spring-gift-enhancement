<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원 목록</title>
</head>
<body>

<h2>회원 목록</h2>

<div>
  <a th:href="@{/admin/members/new}">
    <button type="button">회원 추가</button>
  </a>
</div>

<table>
  <thead>
  <tr>
    <th>이메일</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="member : ${members}">
    <td th:text="${member.email}">@</td>
    <td>
      <a th:href="@{/admin/members/edit/{id}(id=${member.id})}">
        <button type="button">수정</button>
      </a>
    </td>
    <td>
      <form th:action="@{/admin/members/delete/{id}(id=${member.id})}" method="post">
        <button type="submit">삭제</button>
      </form>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
